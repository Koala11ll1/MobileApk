name: Emulator diagnose

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build APK with x86_64 support
        run: >
          dotnet build ZarobitokApp/ZarobitokApp.csproj
          -f net10.0-android
          -c Debug
          -p:AndroidPackageFormat=apk
          -p:EmbedAssembliesIntoApk=true
          -p:RuntimeIdentifiers="android-arm64;android-x64"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator, capture logcat + screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            APK=$(find ZarobitokApp/bin/Debug/net10.0-android -name "*-Signed.apk" | head -1)
            echo "APK: $APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell monkey -p com.zarobitok.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > logcat-full.txt
            adb logcat -d -b crash > logcat-crash.txt || true
            adb exec-out screencap -p > screen.png || true
            echo "===== CRASH BUFFER ====="
            cat logcat-crash.txt || true
            echo "===== RELEVANT LINES ====="
            grep -iE "AndroidRuntime|FATAL|Unhandled|mono|dotnet|zarobitok" logcat-full.txt | tail -150 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-diagnostics
          path: |
            logcat-full.txt
            logcat-crash.txt
            screen.png
          if-no-files-found: warn
