name: Verify (emulator)

# Тимчасова перевірка на емуляторі: тема, мова, замок PIN.
on:
  workflow_dispatch: {}
  push:
    branches: [ccr-80f77d4d-5ur704]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui-android
      - name: Build x64 debug APK
        run: >
          dotnet build ZarobitokApp/ZarobitokApp.csproj
          -f net10.0-android -c Debug
          -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true
          -p:RuntimeIdentifiers=android-x64 -p:AndroidIncludeDebugSymbols=false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          target: google_apis
          disable-animations: true
          script: bash ./scripts/verify.sh
