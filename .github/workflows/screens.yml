name: Screenshots (temporary)

# Тимчасово: скріни нового дизайну з емулятора. Видаляється після перегляду.
on:
  push:
    branches: [ccr-80f77d4d-5ur704]

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install maui-android
      - name: Build debug APK (x64 for the emulator)
        run: dotnet build ZarobitokApp/ZarobitokApp.csproj -f net10.0-android -c Debug -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true -p:RuntimeIdentifiers=android-x64 -p:AndroidIncludeDebugSymbols=false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7_pro
          target: google_apis
          disable-animations: true
          script: bash ./scripts/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens/
      - name: Push screenshots to a temporary branch (artifact storage is not reachable from the dev session)
        if: always()
        run: |
          cd screens
          git init -q -b screens-preview
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "screens $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens-preview
