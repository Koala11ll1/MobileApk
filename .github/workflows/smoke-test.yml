name: Smoke test (emulator)

# Ручний запуск: збирає x64-APK, ставить в емулятор, відкриває всі вкладки
# й показує збої з logcat. Окремо від основної збірки, бо довший.
on:
  workflow_dispatch: {}
  push:
    branches: [ccr-80f77d4d-5ur704]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build x64 debug APK
        run: >
          dotnet build ZarobitokApp/ZarobitokApp.csproj
          -f net10.0-android
          -c Debug
          -p:AndroidPackageFormat=apk
          -p:EmbedAssembliesIntoApk=true
          -p:RuntimeIdentifiers=android-x64
          -p:AndroidIncludeDebugSymbols=false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          target: google_apis
          disable-animations: true
          script: bash ./scripts/smoke.sh
