name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build debug APK (sideload-signed)
        run: >
          dotnet build ZarobitokApp/ZarobitokApp.csproj
          -f net10.0-android
          -c Debug
          -p:AndroidPackageFormat=apk
          -p:EmbedAssembliesIntoApk=true
          -p:RuntimeIdentifiers=android-arm64
          -p:AndroidIncludeDebugSymbols=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZarobitokApp-debug-apk
          path: ZarobitokApp/bin/Debug/net10.0-android/*.apk
          if-no-files-found: error
