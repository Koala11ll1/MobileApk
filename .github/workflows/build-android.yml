name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore stable signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set — falling back to the auto-generated debug keystore."
            echo "Its signature changes every run, so each new build will require uninstalling the previous one first."
            echo "SIGNING_ARGS=" >> "$GITHUB_ENV"
          else
            KEYSTORE_PATH="$RUNNER_TEMP/zarobitok.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "SIGNING_ARGS=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$KEYSTORE_PATH -p:AndroidSigningKeyAlias=zarobitok -p:AndroidSigningKeyPass=$KEYSTORE_PASSWORD -p:AndroidSigningStorePass=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK (sideload-signed)
        run: >
          dotnet build ZarobitokApp/ZarobitokApp.csproj
          -f net10.0-android
          -c Debug
          -p:AndroidPackageFormat=apk
          -p:EmbedAssembliesIntoApk=true
          -p:RuntimeIdentifiers=android-arm64
          -p:AndroidIncludeDebugSymbols=false
          $SIGNING_ARGS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZarobitokApp-debug-apk
          path: ZarobitokApp/bin/Debug/net10.0-android/*.apk
          if-no-files-found: error
